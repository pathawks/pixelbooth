# CI pipeline for PixelBooth.
# Runs on GitHub's Apple Silicon Xcode 27 image with the macOS 27.0 SDK.
# Distinguishes toolchain unavailability from a successful run; hardware-dependent
# checks are reported as "Not run", never as passed.

name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: xcode-27  # arm64 macOS 27 runner with Xcode 27 preinstalled
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - name: Install toolchain prerequisites
        run: brew install cmake ninja nasm
      - name: Build + test
        run: scripts/validate.sh
      - name: Assemble app bundle
        run: scripts/build_app.sh
